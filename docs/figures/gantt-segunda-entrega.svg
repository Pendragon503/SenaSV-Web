<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cronograma Gantt de la segunda entrega de SeñaSV</title>
  <desc id="desc">Plan de seis semanas con actividades, barras de duración y metas cuantificables.</desc>
  <rect width="1600" height="900" fill="#f4f7f9"/>
  <rect x="64" y="52" width="1472" height="796" rx="18" fill="#ffffff" stroke="#cad7df" stroke-width="2"/>
  <rect x="64" y="52" width="1472" height="126" rx="18" fill="#0b2942"/>
  <rect x="64" y="154" width="1472" height="24" fill="#0b2942"/>
  <text x="104" y="105" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">SeñaSV · Cronograma de segunda entrega</text>
  <text x="104" y="143" fill="#b9ceda" font-family="Arial, sans-serif" font-size="18">Plan de ejecución con indicadores verificables · 24 nov. 2026 – 4 ene. 2027</text>

  <text x="104" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">ACTIVIDAD</text>
  <text x="582" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">S1</text>
  <text x="712" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">S2</text>
  <text x="842" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">S3</text>
  <text x="972" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">S4</text>
  <text x="1102" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">S5</text>
  <text x="1232" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">S6</text>
  <text x="1362" y="224" fill="#415766" font-family="Arial, sans-serif" font-size="16" font-weight="700">META</text>

  <g stroke="#e0e7eb" stroke-width="1">
    <line x1="540" y1="198" x2="540" y2="714"/><line x1="670" y1="198" x2="670" y2="714"/><line x1="800" y1="198" x2="800" y2="714"/>
    <line x1="930" y1="198" x2="930" y2="714"/><line x1="1060" y1="198" x2="1060" y2="714"/><line x1="1190" y1="198" x2="1190" y2="714"/>
    <line x1="1320" y1="198" x2="1320" y2="714"/><line x1="64" y1="244" x2="1536" y2="244"/><line x1="64" y1="322" x2="1536" y2="322"/>
    <line x1="64" y1="400" x2="1536" y2="400"/><line x1="64" y1="478" x2="1536" y2="478"/><line x1="64" y1="556" x2="1536" y2="556"/>
    <line x1="64" y1="634" x2="1536" y2="634"/><line x1="64" y1="712" x2="1536" y2="712"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="104" y="278" fill="#17364c" font-size="19" font-weight="700">Documentación y figuras</text><text x="104" y="302" fill="#637683" font-size="14">Normalización visual y referencias</text>
    <rect x="556" y="266" width="244" height="32" rx="7" fill="#247b9b"/><text x="1340" y="287" fill="#17364c" font-size="15" font-weight="700">100 % conformes</text>

    <text x="104" y="356" fill="#17364c" font-size="19" font-weight="700">Alcance lingüístico visible</text><text x="104" y="380" fill="#637683" font-size="14">Alfabeto, dígrafos y numeración</text>
    <rect x="556" y="344" width="244" height="32" rx="7" fill="#4d94aa"/><text x="1340" y="365" fill="#17364c" font-size="15" font-weight="700">A–Z y 0–100</text>

    <text x="104" y="434" fill="#17364c" font-size="19" font-weight="700">Pruebas navegador, cámara y PWA</text><text x="104" y="458" fill="#637683" font-size="14">Compatibilidad y rendimiento</text>
    <rect x="686" y="422" width="374" height="32" rx="7" fill="#14705a"/><text x="1340" y="443" fill="#17364c" font-size="15" font-weight="700">5 nav. · 3 cámaras</text>

    <text x="104" y="512" fill="#17364c" font-size="19" font-weight="700">Validación del backend</text><text x="104" y="536" fill="#637683" font-size="14">API, seguridad y persistencia</text>
    <rect x="816" y="500" width="244" height="32" rx="7" fill="#34657d"/><text x="1340" y="521" fill="#17364c" font-size="15" font-weight="700">8 casos API</text>

    <text x="104" y="590" fill="#17364c" font-size="19" font-weight="700">Dataset y evaluación</text><text x="104" y="614" fill="#637683" font-size="14">Captura, partición y métricas</text>
    <rect x="946" y="578" width="244" height="32" rx="7" fill="#876d2e"/><text x="1340" y="599" fill="#17364c" font-size="15" font-weight="700">F1 objetivo ≥0.80</text>

    <text x="104" y="668" fill="#17364c" font-size="19" font-weight="700">Consolidación de entrega</text><text x="104" y="692" fill="#637683" font-size="14">Informe, anexos y demostración</text>
    <rect x="1206" y="656" width="114" height="32" rx="7" fill="#0b2942"/><text x="1340" y="677" fill="#17364c" font-size="15" font-weight="700">Entrega reproducible</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="104" y="770" fill="#17364c" font-size="17" font-weight="700">Indicadores transversales</text>
    <rect x="104" y="792" width="292" height="34" rx="17" fill="#e6f2f5"/><text x="126" y="815" fill="#164d6d" font-size="14" font-weight="700">≥15 FPS en móvil objetivo</text>
    <rect x="416" y="792" width="252" height="34" rx="17" fill="#e6f2f5"/><text x="438" y="815" fill="#164d6d" font-size="14" font-weight="700">Latencia p95 ≤150 ms</text>
    <rect x="688" y="792" width="296" height="34" rx="17" fill="#e8f4ef"/><text x="710" y="815" fill="#14705a" font-size="14" font-weight="700">≥90 % de casos aprobados</text>
    <rect x="1004" y="792" width="426" height="34" rx="17" fill="#f4efe2"/><text x="1026" y="815" fill="#6f5926" font-size="14" font-weight="700">≥5 signantes · ≥30 muestras/clase</text>
  </g>
</svg>
